[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_pipeline"
version = "0.5.0"
description = "Wildlife and nature photo hotspots from geotagged photos: iNaturalist and YFCC100M ingestion, equal-area hex binning, photographer-weighted Moran's I and Getis-Ord Gi* hotspots, seasonal timing, and a map dashboard."
readme = "README.MD"
license = { text = "MIT" }
authors = [
    { name = "Gilberto Romero-Cano", email = "gilbertorcp712@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "geospatial",
    "hotspots",
    "photography",
    "wildlife",
    "inaturalist",
    "yfcc100m",
    "flickr",
    "spatial-statistics",
    "morans-i",
    "getis-ord",
    "hexagonal-binning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "pyproj>=3.4.0",
    "typer>=0.9.0",
    "rich>=12.0.0"
]

[project.urls]
Homepage = "https://github.com/gilbertorcp/spatial_pipeline"
Documentation = "https://gilbertorcp.github.io/spatial_pipeline"
Repository = "https://github.com/gilbertorcp/spatial_pipeline.git"
Issues = "https://github.com/gilbertorcp/spatial_pipeline/issues"
Changelog = "https://github.com/gilbertorcp/spatial_pipeline/blob/main/CHANGELOG.md"

[project.scripts]
spatial-pipeline = "spatial_pipeline.cli:main"

[project.optional-dependencies]
ui = [
    "streamlit>=1.20.0",
    "pydeck>=0.8.0"
]
scale = [
    "dask[dataframe]>=2023.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "types-setuptools"
]
docs = [
    "sphinx>=7.0.0",
    "myst-nb>=1.0.0",
    "sphinx-book-theme>=1.0.0",
    "sphinx-copybutton>=0.5.0",
    "ipywidgets>=8.0.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0; platform_system == 'Linux'",
    "cuml-cu12; platform_system == 'Linux'",
    "cugraph-cu12; platform_system == 'Linux'"
]
all = [
    "spatial_pipeline[ui,scale,test,docs,gpu]"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
spatial_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --durations=10"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["spatial_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
