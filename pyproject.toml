[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_pipeline"
version = "0.4.0"
description = "A high-performance engine for spatial transcriptomics binning, GPU/CPU graph generation, Dask/Zarr out-of-core streaming, & AnnData interop."
readme = "README.MD"
license = { text = "MIT" }
authors = [
    { name = "Gilberto Romero-Cano", email = "gilbertorcp712@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "spatial-transcriptomics",
    "computational-biology",
    "single-cell",
    "anndata",
    "gpu-acceleration",
    "cugraph",
    "cuml",
    "dask",
    "zarr",
    "graph-neural-networks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "polars>=0.19.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
    "pyarrow>=10.0.0",
    "typer>=0.9.0",
    "click>=8.0.0",
    "memory-profiler>=0.60.0",
    "anndata>=0.9.0",
    "h5py>=3.0.0",
    "zarr>=2.14.0",
    "dask[dataframe]>=2023.0.0",
    "scikit-learn>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/gilbertorcp/spatial_pipeline"
Documentation = "https://gilbertorcp.github.io/spatial_pipeline"
Repository = "https://github.com/gilbertorcp/spatial_pipeline.git"
Issues = "https://github.com/gilbertorcp/spatial_pipeline/issues"
Changelog = "https://github.com/gilbertorcp/spatial_pipeline/blob/main/CHANGELOG.md"

[project.scripts]
spatial-pipeline = "spatial_pipeline.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "types-setuptools"
]
docs = [
    "sphinx>=7.0.0",
    "myst-nb>=1.0.0",
    "sphinx-book-theme>=1.0.0",
    "sphinx-copybutton>=0.5.0",
    "ipywidgets>=8.0.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0; platform_system == 'Linux'",
    "cuml-cu12; platform_system == 'Linux'",
    "cugraph-cu12; platform_system == 'Linux'"
]
all = [
    "spatial_pipeline[test,docs,gpu]"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
spatial_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --durations=10"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["spatial_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
