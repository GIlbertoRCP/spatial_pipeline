[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_pipeline"
version = "0.3.0"
description = "A high-performance pipeline for spatial transcriptomics binning, graph generation, & AnnData interop."
readme = "README.md"
authors = [
    { name = "Gilberto Romero-Cano", email = "gilbertorcp712@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "polars>=0.19.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
    "pyarrow>=10.0.0",
    "typer>=0.9.0",
    "click>=8.0.0",
    "memory-profiler>=0.60.0",
    "anndata>=0.9.0",
    "h5py>=3.0.0"
]


[project.scripts]
spatial-pipeline = "spatial_pipeline.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

